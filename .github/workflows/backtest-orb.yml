name: Day Trading Backtest

# Reads historical price data; never places orders.
# Every Saturday it re-runs both backtests with the newest week of data.
on:
  schedule:
    - cron: "17 12 * * 6"   # Saturday ~8 AM New York
  workflow_dispatch:
    inputs:
      test:
        description: "Which backtest"
        type: choice
        options: [daytrade, orb, both, plugin, tjr]
        default: daytrade
      years:
        description: "Years of history to test"
        default: "1"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt lxml

      # Reuse 5-minute bars downloaded by earlier runs; only new days/stocks are fetched.
      - name: Restore saved price bars
        uses: actions/cache/restore@v4
        with:
          path: backtest_orb_cache
          key: orb-bars-v2-${{ github.run_id }}
          restore-keys: orb-bars-v2-

      - name: Run backtest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          start=$(date +%s)
          test="${{ inputs.test || 'both' }}"; years="${{ inputs.years || '1' }}"
          if [ "$test" = "orb" ] || [ "$test" = "both" ]; then python backtest_orb.py --years "$years"; fi
          if [ "$test" = "daytrade" ] || [ "$test" = "both" ]; then python backtest_daytrade.py --years "$years"; fi
          if [ "$test" = "plugin" ] || [ "$test" = "both" ]; then python backtest_plugin.py --years "$years" --budget 100; fi
          if [ "$test" = "tjr" ] || [ "$test" = "both" ]; then python backtest_tjr.py --years "$years"; fi
          echo "Backtest took $(( $(date +%s) - start )) seconds"

      - name: Save price bars for next time
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backtest_orb_cache
          key: orb-bars-v2-${{ github.run_id }}

      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.test || 'both' }}-results
          path: |
            backtest_orb_results/
            backtest_daytrade_results/
            backtest_plugin_results/
            backtest_tjr_results/
          retention-days: 30

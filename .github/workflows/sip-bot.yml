name: Day Trader (Stocks in Play)

# Paper account only. Two jobs because GitHub limits one job to 6 hours:
#   day   - 9:20 AM New York until SIP_ENTRY_UNTIL: pick stocks, place entries, add stops
#   close - then until SIP_FLATTEN_AT: keep stops in place, close everything, save the log
on:
  schedule:
    # 9:20 AM New York is 13:20 UTC in daylight time (EDT), 14:20 UTC in standard time (EST).
    - cron: "20 13 * * 1-5"
    - cron: "20 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (pick stocks and log, place no orders)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sip-bot
  cancel-in-progress: false

jobs:
  day:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    outputs:
      run: ${{ steps.gate.outputs.run }}
      dry: ${{ steps.gate.outputs.dry }}
    steps:
      - name: Check time
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "dry=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "dry=false" >> "$GITHUB_OUTPUT"
          if [ "$(TZ=America/New_York date +%Z)" = "EDT" ]; then wanted="20 13 * * 1-5"; else wanted="20 14 * * 1-5"; fi
          if [ "${{ github.event.schedule }}" = "$wanted" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "Not 9:20 AM New York time for this trigger; skipping."; echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt lxml

      - name: Trade (morning to entry cutoff)
        if: steps.gate.outputs.run == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python sip_bot.py --phase day $([ "${{ steps.gate.outputs.dry }}" = "true" ] && echo --dry-run)

      - name: Hand state to the afternoon job
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sip-state
          path: |
            sip_plan.json
            sip_bot.log
          if-no-files-found: ignore
          retention-days: 7

  close:
    needs: day
    # always(): even if the morning job failed, the afternoon job still closes positions
    if: always() && needs.day.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt lxml
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sip-state

      - name: Manage stops and close by the end of the day
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python sip_bot.py --phase close $([ "${{ needs.day.outputs.dry }}" = "true" ] && echo --dry-run)

      - name: Save log and plan to the repo
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          for f in sip_bot.log sip_plan.json; do [ -f "$f" ] && git add -f "$f"; done
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Day trader $(TZ=America/New_York date '+%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

name: Opening Range Backtest

# Runs only when started by hand. Reads historical price data; never places orders.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history to test"
        default: "1"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt lxml

      # Reuse 5-minute bars downloaded by earlier runs; only new days/stocks are fetched.
      - name: Restore saved price bars
        uses: actions/cache/restore@v4
        with:
          path: backtest_orb_cache
          key: orb-bars-${{ github.run_id }}
          restore-keys: orb-bars-

      - name: Run backtest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python backtest_orb.py --years ${{ inputs.years }}

      - name: Save price bars for next time
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backtest_orb_cache
          key: orb-bars-${{ github.run_id }}

      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: orb-results
          path: backtest_orb_results/
          retention-days: 30

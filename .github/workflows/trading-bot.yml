name: AAPL MA Crossover Bot

on:
  schedule:
    # GitHub cron runs in UTC and can delay or drop scheduled runs when it is busy, so
    # there are several chances each morning. 9:31 AM New York is 13:31 UTC in daylight
    # time (EDT) and 14:31 UTC in standard time (EST). The "Check time" step runs the bot
    # once per day: the first trigger between 9:28 and 11:30 AM New York wins, the rest skip.
    - cron: "31 13 * * 1-5"
    - cron: "43 13 * * 1-5"
    - cron: "57 13 * * 1-5"
    - cron: "31 14 * * 1-5"
    - cron: "43 14 * * 1-5"
    - cron: "57 14 * * 1-5"
  workflow_dispatch:   # lets you run it by hand from the Actions tab
    inputs:
      dry_run:
        description: "Dry run (scan and log, but place no orders)"
        type: boolean
        default: true

permissions:
  contents: write      # needed to save trading_bot.log and bot_state.json back to the repo

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check time
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          today=$(TZ=America/New_York date +%F); now=$(TZ=America/New_York date +%H%M)
          last=$(cat last_run.txt 2>/dev/null || echo none)
          if [ "$now" -lt 0928 ] || [ "$now" -gt 1130 ]; then
            echo "Outside the 9:28-11:30 AM New York window ($now); skipping."; echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$last" = "$today" ]; then
            echo "Already ran today; skipping."; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run bot
        if: steps.gate.outputs.run == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python trading_bot.py --dry-run
          else
            python trading_bot.py
            # remember that today's real run happened, so later triggers skip
            TZ=America/New_York date +%F > last_run.txt
          fi

      - name: Save log and state to the repo
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          for f in trading_bot.log bot_state.json scan_results.json last_run.txt; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Bot run $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
